<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="92" fill="#94A3B8" stroke="#475569" stroke-width="4"/>
  <circle cx="100" cy="100" r="82" fill="#64748B" stroke="#334155" stroke-width="2"/>
  <!-- Two-masted ship -->
  <path d="M50,115 Q100,140 150,115 L145,128 Q100,150 55,128 Z" fill="#1E293B"/>
  <!-- Water Waves -->
  <path d="M40,140 Q55,135 70,140 Q85,145 100,140 Q115,135 130,140 Q145,145 160,140" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>
  <!-- Masts -->
  <line x1="80" y1="65" x2="80" y2="120" stroke="#1E293B" stroke-width="3"/>
  <line x1="120" y1="60" x2="120" y2="120" stroke="#1E293B" stroke-width="3"/>
  <!-- Rigging and Sails -->
  <path d="M80,70 L65,100 L80,100 Z" fill="#E2E8F0" opacity="0.8"/>
  <path d="M120,65 L135,95 L120,95 Z" fill="#E2E8F0" opacity="0.8"/>
  <text x="100" y="175" font-family="'Cinzel', serif" font-size="10" font-weight="bold" fill="#F8FAFC" text-anchor="middle">SATAVAHANA LEAD SHIP</text>
</svg>
